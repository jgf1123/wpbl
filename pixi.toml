[workspace]
authors = ["jgf1123 <jgf1123@gmail.com>"]
channels = ["conda-forge"]
name = "wpbl"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
scrape = "python -m wpbl.scrape"
build = "python -m wpbl.parse"
check = "python -m wpbl.validate"
rosters = "python -m wpbl.rosters"
timeline = "python -m wpbl.timeline"
chart = "python -m wpbl.usage_chart"
innings = "python -m wpbl.innings"
re = "python -m wpbl.run_expectancy"
wp = "python -m wpbl.win_probability"
wpq = "python -m wpbl.wp_query"
teams = "python -m wpbl.team_strength"
team-chart = "python -m wpbl.team_chart"
upsets = "python -m wpbl.upsets"
rollercoaster = "python -m wpbl.rollercoaster"
pwp = "python -m wpbl.pitcher_wp"
timeline-chart = "python -m wpbl.game_timeline"
games = "python -m wpbl.lookup"
blowouts = "python -m wpbl.blowouts"
leverage = "python -m wpbl.leverage"
bullpen = "python -m wpbl.bullpen"
relievers = "python -m wpbl.relievers"
depth = "python -m wpbl.depth"
pitches = "python -m wpbl.pitch_counts"
workload = "python -m wpbl.workload"
batters = "python -m wpbl.batters"
batter-chart = "python -m wpbl.batter_chart"
weights = "python -m wpbl.linear_weights"
markov = "python -m wpbl.markov"
positions = "python -m wpbl.positions"
pitchers = "python -m wpbl.pitchers"
pitcher-chart = "python -m wpbl.pitcher_chart"
defense = "python -m wpbl.defense"
running = "python -m wpbl.running_game"
table = "python -m wpbl.table_image"
dice = "python -m wpbl.dice"
refresh = { depends-on = ["scrape", "build", "check"] }

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = ">=3.14.7,<3.15"
pandas = ">=3.0.5,<4"
pyarrow = ">=25.0.0,<26"
duckdb = ">=1.5.5,<2"
requests = ">=2.34.2,<3"
matplotlib = ">=3.11.1,<4"
